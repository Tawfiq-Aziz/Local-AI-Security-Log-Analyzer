<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Log Analyzer</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-brand">
      <div class="brand-indicator"></div>
      <h1>Security Log Analyzer</h1>
    </div>
    
    <!-- Telemetry Monitor -->
    <div class="telemetry-bar" id="telemetryBar">
      <div class="telemetry-item">
        <span class="label">RAM</span>
        <span class="value" id="procRamText">-- MB</span>
      </div>
      <div class="telemetry-item">
        <span class="badge badge-online" id="statusBadge">Ready</span>
      </div>
    </div>
  </header>

  <main class="container">
    
    <!-- Upload Section -->
    <section class="card" id="uploadSection">
      <h2>Upload Log</h2>
      
      <div class="dropzone" id="dropzone">
        <svg class="drop-svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p class="drop-text">Drag and drop a log file here, or <label for="fileInput" class="browse-link">browse</label></p>
        <input type="file" id="fileInput" accept=".log,.txt" style="display: none;">
        <span class="file-info" id="fileInfo"></span>
      </div>

      <div class="action-row">
        <button class="btn btn-primary" id="startBtn" disabled>Analyze File</button>
        <button class="btn btn-secondary" id="sampleBtn">Analyze Sample Log</button>
      </div>
    </section>

    <!-- Progress Section -->
    <section class="card" id="progressSection" style="display: none;">
      <div class="card-header">
        <h2>Analysis</h2>
        <span class="spinner" id="spinner"></span>
      </div>

      <div class="progress-details">
        <div class="progress-labels">
          <span id="progressStatusText">Starting analysis...</span>
          <span id="chunkFraction">Chunk 0 / 0</span>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
        </div>
      </div>

      <div class="metrics-grid">
        <div class="metric-box">
          <span class="metric-val" id="metricLines">0</span>
          <span class="metric-lbl">Lines</span>
        </div>
        <div class="metric-box">
          <span class="metric-val" id="metricTokens">0</span>
          <span class="metric-lbl">Tokens</span>
        </div>
        <div class="metric-box">
          <span class="metric-val" id="metricAlerts">0</span>
          <span class="metric-lbl">Alerts</span>
        </div>
        <div class="metric-box">
          <span class="metric-val" id="metricTime">0.0s</span>
          <span class="metric-lbl">Time</span>
        </div>
      </div>

      <div class="live-feed">
        <h3>Events</h3>
        <div class="feed-console" id="feedConsole">
          <div class="feed-entry system">Pipeline ready.</div>
        </div>
      </div>
    </section>

    <!-- Report Section -->
    <section class="card" id="reportSection" style="display: none;">
      <div class="report-header">
        <div>
          <h2>Threat Report</h2>
          <p class="subtitle" id="reportSubtitle">Consolidated security findings</p>
        </div>
        <div class="report-actions">
          <button class="btn btn-secondary" id="exportBtn">Export JSON</button>
          <button class="btn btn-outline" id="resetBtn">New Analysis</button>
        </div>
      </div>

      <!-- Severity Summary -->
      <div class="kpi-banner">
        <div class="kpi-card critical">
          <span class="kpi-num" id="kpiCritical">0</span>
          <span class="kpi-label">Critical</span>
        </div>
        <div class="kpi-card high">
          <span class="kpi-num" id="kpiHigh">0</span>
          <span class="kpi-label">High</span>
        </div>
        <div class="kpi-card medium">
          <span class="kpi-num" id="kpiMedium">0</span>
          <span class="kpi-label">Medium</span>
        </div>
        <div class="kpi-card low">
          <span class="kpi-num" id="kpiLow">0</span>
          <span class="kpi-label">Low</span>
        </div>
      </div>

      <!-- Incidents List -->
      <div class="incidents-container">
        <h3>Detected Threats</h3>
        <div id="incidentsList"></div>
      </div>
    </section>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
